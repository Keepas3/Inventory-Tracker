name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build uses no secrets: pages are dynamic and nothing touches the DB or the Anthropic API at build time.
      - run: npm run build
      - name: Dependency audit (production deps, fail on high+)
        run: npm audit --omit=dev --audit-level=high
